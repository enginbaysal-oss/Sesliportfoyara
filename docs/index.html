<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmlakCep</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0F141E;
            overflow: hidden;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <aside id="emlakcepBootDiagnostic" role="alert" hidden>
      <strong id="emlakcepBootTitle">EmlakCep açılış sorunu</strong>
      <p id="emlakcepBootDetails"></p>
      <button type="button" id="emlakcepBootReload">Tekrar Dene</button>
      <button type="button" id="emlakcepBootDismiss">Kapat</button>
      <small>Yeniden deneme kayıtlarınızı ve cihazdaki portföylerinizi silmez.</small>
    </aside>
    <style>
      #emlakcepBootDiagnostic[hidden]{display:none!important}
      #emlakcepBootDiagnostic{position:fixed;z-index:2147483646;left:16px;right:16px;bottom:16px;max-width:560px;margin:auto;
        background:#fff;color:#193652;border:2px solid #dc9639;border-radius:14px;padding:18px;box-shadow:0 6px 34px #0006;
        box-sizing:border-box;font:15px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}
      #emlakcepBootDiagnostic strong{font-size:19px}
      #emlakcepBootDiagnostic p{margin:6px 0 12px}
      #emlakcepBootDiagnostic button{background:#146b8d;color:white;padding:9px 14px;border:0;border-radius:9px;margin-right:8px;cursor:pointer;font-weight:750}
      #emlakcepBootDiagnostic small{display:block;margin-top:10px;color:#647a8c}
    </style>
    <script>
      (function(){
        "use strict";
        var diagnostic=document.getElementById("emlakcepBootDiagnostic");
        var title=document.getElementById("emlakcepBootTitle");
        var details=document.getElementById("emlakcepBootDetails");
        var canvas=document.getElementById("ComposeTarget");
        var bootHasStarted=false;
        function show(message){
          if(bootHasStarted)return;
          title.textContent="EmlakCep açılış sorunu";
          details.textContent=String(message||"Başlatılamadı").slice(0,250);
          diagnostic.hidden=false;
        }
        function markStarted(){
          bootHasStarted=true;diagnostic.hidden=true;
        }
        // Compose sets its canvas buffer size once the WebAssembly engine starts.
        var observer=new MutationObserver(function(){
          if(canvas.width>300&&canvas.height>150){markStarted();observer.disconnect();}
        });
        observer.observe(canvas,{attributes:true,attributeFilter:["width","height"]});
        window.addEventListener("error",function(e){
          if(bootHasStarted)return;
          show("Uygulama dosyası veya çalıştırma hatası: "+String(e.message||"bilinmeyen hata"));
        });
        window.addEventListener("unhandledrejection",function(e){
          if(bootHasStarted)return;
          var reason=e.reason&&e.reason.message||e.reason||"başlatma hatası";
          show("Başlatma işlemi tamamlanamadı: "+String(reason));
        });
        document.getElementById("emlakcepBootReload").onclick=function(){location.reload();};
        document.getElementById("emlakcepBootDismiss").onclick=function(){diagnostic.hidden=true;};
        window.setTimeout(function(){
          if(!bootHasStarted)show("Uygulama 15 saniye içinde başlatılamadı. Bağlantıyı ve tarayıcı hatasını kontrol edin.");
        },15000);
      })();
    </script>
    <script src="composeApp.js?v=20261122-manisa-cards-v3" onerror="document.getElementById('emlakcepBootDiagnostic').hidden=false;document.getElementById('emlakcepBootDetails').textContent='EmlakCep açılış dosyası indirilemedi (composeApp.js).';"></script>
</body>
</html>
