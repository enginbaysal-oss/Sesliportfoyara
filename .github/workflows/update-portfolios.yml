name: RE/MAX Portföylerini Otomatik Güncelle

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Node.js Kurulumu
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Puppeteer Bağımlılığını Yükle
        run: npm install puppeteer

      - name: RE/MAX Verilerini Çek (Puppeteer)
        run: node fetch-remax.js

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: RE/MAX portföy verileri Puppeteer ile güncellendi [skip ci]" || exit 0
          git push