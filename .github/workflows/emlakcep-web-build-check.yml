name: EmlakCep Web Build Validation
on:
  push:
    branches: [master-app-merge]
    paths:
      - ".github/workflows/emlakcep-web-build-check.yml"
      - "app/src/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare Linux-only Gradle settings
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties
          chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile web release
        run: ./gradlew :app:wasmJsBrowserDistribution --no-daemon --no-configuration-cache --stacktrace
      - name: Verify compiled output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/build/dist/wasmJs/productionExecutable")
          js=root/"composeApp.js"
          if not js.is_file() or js.stat().st_size<50000: raise SystemExit("Compiled JS missing")
          import re
          src=js.read_text(encoding="utf-8")
          wasm=set(re.findall(r'([a-f0-9]{20}\.wasm)',src))
          if not wasm: raise SystemExit("Compiled Wasm references missing")
          missing=[n for n in wasm if not (root/n).is_file()]
          if missing: raise SystemExit("Missing Wasm assets: "+",".join(missing))
          print("Validated",len(wasm),"Wasm assets; no published site changed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: emlakcep-web-compiled-staging
          path: app/build/dist/wasmJs/productionExecutable/
          retention-days: 5
